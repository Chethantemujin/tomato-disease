services:
  - type: web
    name: tomato-disease-api
    runtime: python

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: TOMATO_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT